# CI workflow for smile-nuxt module

name: ci

on:
  push:
    branches:
      - main
      - nuxt
  pull_request:
    branches:
      - main
      - nuxt

jobs:
  ci:
    runs-on: ubuntu-24.04 # pinned; ubuntu-latest is moving to 26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node_version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Prepare module
        run: pnpm run dev:prepare

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run test:types

      - name: Build module
        run: pnpm run prepack

      - name: Run tests
        run: pnpm run test

      - name: Override / inheritance regression test (real consumer install)
        run: pnpm run test:overrides
