# Build the VitePress docs and rsync them to the docs web server.
# Triggers on pushes to main that touch docs/, or manually.

name: docs-deploy

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# Allow one concurrent docs deploy; don't cancel an in-progress one.
concurrency:
  group: smile-docs
  cancel-in-progress: false

jobs:
  docs-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node_version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Generates .nuxt/tsconfig.json at the repo root, which the docs build
      # needs because root tsconfig.json extends ./.nuxt/tsconfig.json. Without
      # this, Vite's esbuild plugin fails to transform docs/.vitepress/theme/*.ts.
      - name: Prepare Nuxt module (generate .nuxt/tsconfig.json)
        run: pnpm dev:prepare

      - name: Build docs
        run: pnpm docs:build

      # Safety check: never rsync --delete into root or an unset path.
      - name: Validate deploy path variables
        run: |
          if [ -z "${{ secrets.DOCS_DEPLOY_PATH }}" ]; then
            echo "::error::DOCS_DEPLOY_PATH secret is not set. Aborting to prevent rsync --delete in wrong directory."
            exit 1
          fi
          if [ "${{ secrets.DOCS_DEPLOY_PATH }}" = "/" ]; then
            echo "::error::DOCS_DEPLOY_PATH is root. Aborting to prevent rsync --delete in wrong directory."
            exit 1
          fi
          echo "Deploy path validated: ${{ secrets.DOCS_DEPLOY_PATH }}"

      - name: rsync to docs server
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avrz --delete
          path: docs/.vitepress/dist/
          remote_path: ${{ secrets.DOCS_DEPLOY_PATH }}
          remote_host: ${{ secrets.DOCS_DEPLOY_HOST }}
          remote_port: ${{ secrets.DOCS_DEPLOY_PORT }}
          remote_user: ${{ secrets.DOCS_DEPLOY_USER }}
          remote_key: ${{ secrets.DOCS_DEPLOY_KEY }}

      - name: Notify lab Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DOCS_WEBHOOK_URL }}
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "github_username": "${{ github.actor }}",
              "github_hash": "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
            }
