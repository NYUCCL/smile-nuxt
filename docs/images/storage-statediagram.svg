<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>How state works in SMILE</title>
  <desc>Components keep their own local state and read and write the shared SMILE store. The store's data and private parts are saved to the database tables participants and private_data; cookieState and localState are kept in the browser's cookies and local storage; browserEphemeral is kept in memory only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#050505"/>
    </marker>
  </defs>
  <rect width="760" height="450" fill="white"/>

  <!-- Components (local state) -->
  <text x="110" y="62" text-anchor="middle" font-size="17" font-weight="600" fill="#050505">Components</text>
  <text x="110" y="84" text-anchor="middle" font-size="14" fill="#444444">each with local state</text>

  <rect x="20" y="105" width="180" height="62" rx="9" fill="white" stroke="#050505" stroke-width="1.5"/>
  <text x="110" y="131" text-anchor="middle" font-size="16" font-weight="600" fill="#050505">Consent</text>
  <text x="110" y="152" text-anchor="middle" font-size="14" fill="#6B6B6B">box ticked?</text>

  <rect x="20" y="191" width="180" height="62" rx="9" fill="white" stroke="#050505" stroke-width="1.5"/>
  <text x="110" y="217" text-anchor="middle" font-size="16" font-weight="600" fill="#050505">Instructions</text>
  <text x="110" y="238" text-anchor="middle" font-size="14" fill="#6B6B6B">page 2 of 4</text>

  <rect x="20" y="277" width="180" height="62" rx="9" fill="white" stroke="#050505" stroke-width="1.5"/>
  <text x="110" y="303" text-anchor="middle" font-size="16" font-weight="600" fill="#050505">Your task</text>
  <text x="110" y="324" text-anchor="middle" font-size="14" fill="#6B6B6B">mouse position</text>

  <!-- read and write -->
  <text x="240" y="100" text-anchor="middle" font-size="14" fill="#444444">read and</text>
  <text x="240" y="116" text-anchor="middle" font-size="14" fill="#444444">write</text>
  <line x1="204" y1="136" x2="276" y2="136" stroke="#050505" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="204" y1="222" x2="276" y2="222" stroke="#050505" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="204" y1="308" x2="276" y2="308" stroke="#050505" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- SMILE store -->
  <rect x="280" y="40" width="190" height="345" rx="9" fill="#FCEFFA" stroke="#050505" stroke-width="1.5"/>
  <text x="375" y="68" text-anchor="middle" font-size="18" font-weight="600" fill="#050505">SMILE store</text>
  <text x="375" y="89" text-anchor="middle" font-size="14" fill="#444444">shared by all components</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" text-anchor="middle" fill="#050505">
    <rect x="288" y="112" width="174" height="30" rx="8" fill="#E7F2F8" stroke="#050505" stroke-width="1.5"/>
    <text x="375" y="132">data</text>
    <rect x="288" y="152" width="174" height="30" rx="8" fill="#E7F2F8" stroke="#050505" stroke-width="1.5"/>
    <text x="375" y="172">private</text>
    <rect x="288" y="207" width="174" height="30" rx="8" fill="#F2F2F2" stroke="#050505" stroke-width="1.5"/>
    <text x="375" y="227">cookieState</text>
    <rect x="288" y="247" width="174" height="30" rx="8" fill="#F2F2F2" stroke="#050505" stroke-width="1.5"/>
    <text x="375" y="267">localState</text>
    <rect x="288" y="302" width="174" height="30" rx="8" fill="white" stroke="#6B6B6B" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="375" y="322" fill="#444444">browserEphemeral</text>
  </g>
  <text x="375" y="358" text-anchor="middle" font-size="14" fill="#6B6B6B">memory only,</text>
  <text x="375" y="375" text-anchor="middle" font-size="14" fill="#6B6B6B">reset on reload</text>

  <!-- Database -->
  <path d="M560,54 L560,212 A90,14 0 0 0 740,212 L740,54" fill="#E7F2F8" stroke="#050505" stroke-width="1.5"/>
  <ellipse cx="650" cy="54" rx="90" ry="14" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="650" y="96" text-anchor="middle" font-size="17" font-weight="600" fill="#050505">Database</text>
  <text x="650" y="117" text-anchor="middle" font-size="14" fill="#444444">SQLite locally,</text>
  <text x="650" y="134" text-anchor="middle" font-size="14" fill="#444444">Turso when deployed</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" text-anchor="middle" fill="#050505">
    <text x="650" y="168">participants</text>
    <text x="650" y="195">private_data</text>
  </g>

  <!-- Browser -->
  <rect x="560" y="240" width="180" height="145" rx="9" fill="#F2F2F2" stroke="#050505" stroke-width="1.5"/>
  <text x="650" y="268" text-anchor="middle" font-size="17" font-weight="600" fill="#050505">Browser</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" text-anchor="middle" fill="#050505">
    <text x="650" y="298">cookies</text>
    <text x="650" y="343">local storage</text>
  </g>
  <text x="650" y="317" text-anchor="middle" font-size="14" fill="#6B6B6B">who the participant is</text>
  <text x="650" y="362" text-anchor="middle" font-size="14" fill="#6B6B6B">conditions, timeline</text>

  <!-- store parts to where they're kept -->
  <g stroke="#050505" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M466,127 C515,127 510,163 575,163"/>
    <path d="M466,167 C515,167 510,190 575,190"/>
    <path d="M466,222 C515,222 510,293 595,293"/>
    <path d="M466,262 C515,262 510,338 580,338"/>
  </g>

  <!-- takeaway -->
  <text x="380" y="428" text-anchor="middle" font-size="16" fill="#050505">Local state is lost on a reload; the store's saved parts come back.</text>
</svg>
