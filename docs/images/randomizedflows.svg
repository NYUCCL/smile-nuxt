<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Randomized and conditional nodes</title>
  <desc>(a) A randomized node: after Views 1 and 2, each participant sees tasks 3 and 4 in one of two orders, then View 5. (b) A conditional node: after 1 and 2, participants in condition A see 3 and 4, those in condition B see 5 and 6, and everyone ends at 7.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#050505"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="white"/>
  <text x="190" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#050505">(a) Randomized order</text>
  <text x="190" y="58" text-anchor="middle" font-size="14" font-family="SF Mono, Menlo, Consolas, monospace" fill="#444444">pushRandomizedNode()</text>
  <text x="570" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#050505">(b) Path set by condition</text>
  <text x="570" y="58" text-anchor="middle" font-size="14" font-family="SF Mono, Menlo, Consolas, monospace" fill="#444444">pushConditionalNode()</text>
  <path d="M190,120 L190,154" fill="none" stroke="#050505" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M190,195 C190,219.5 130,219.5 130,244" fill="none" stroke="#050505" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <path d="M130,285 L130,319" fill="none" stroke="#050505" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M130,360 C130,384.5 190,384.5 190,409" fill="none" stroke="#050505" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M190,195 C190,219.5 250,219.5 250,244" fill="none" stroke="#050505" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <path d="M250,285 L250,319" fill="none" stroke="#050505" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M250,360 C250,384.5 190,384.5 190,409" fill="none" stroke="#050505" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="190" cy="100" r="18" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="190" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">1</text>
  <circle cx="190" cy="175" r="18" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="190" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">2</text>
  <circle cx="190" cy="430" r="18" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="190" y="435" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">5</text>
  <circle cx="130" cy="265" r="18" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="130" y="270" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">3</text>
  <circle cx="130" cy="340" r="18" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="130" y="345" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">4</text>
  <circle cx="250" cy="265" r="18" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="250" y="270" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">4</text>
  <circle cx="250" cy="340" r="18" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="250" y="345" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">3</text>
  <text x="190" y="476" text-anchor="middle" font-size="14" fill="#444444">each participant gets one order, at random</text>
  <path d="M570,120 L570,154" fill="none" stroke="#050505" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M570,195 C570,219.5 510,219.5 510,244" fill="none" stroke="#050505" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <path d="M510,285 L510,319" fill="none" stroke="#050505" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M510,360 C510,384.5 570,384.5 570,409" fill="none" stroke="#050505" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M570,195 C570,219.5 630,219.5 630,244" fill="none" stroke="#050505" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <path d="M630,285 L630,319" fill="none" stroke="#050505" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M630,360 C630,384.5 570,384.5 570,409" fill="none" stroke="#050505" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="570" cy="100" r="18" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="570" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">1</text>
  <circle cx="570" cy="175" r="18" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="570" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">2</text>
  <circle cx="570" cy="430" r="18" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="570" y="435" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">7</text>
  <circle cx="510" cy="265" r="18" fill="#F9D174" stroke="#050505" stroke-width="1.5"/>
  <text x="510" y="270" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">3</text>
  <circle cx="510" cy="340" r="18" fill="#F9D174" stroke="#050505" stroke-width="1.5"/>
  <text x="510" y="345" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">4</text>
  <circle cx="630" cy="265" r="18" fill="#E8B2E3" stroke="#050505" stroke-width="1.5"/>
  <text x="630" y="270" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">5</text>
  <circle cx="630" cy="340" r="18" fill="#E8B2E3" stroke="#050505" stroke-width="1.5"/>
  <text x="630" y="345" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">6</text>
  <text x="482" y="270" text-anchor="end" font-size="14" fill="#444444">condition A</text>
  <text x="658" y="270" text-anchor="start" font-size="14" fill="#444444">condition B</text>
</svg>
