<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Sequential and non-sequential Views</title>
  <desc>Sequential Views, added with timeline.pushSeqView, form an ordered chain: /welcome, /consent, /demograph, /windowsizer, /task, /debrief, /feedback, /thanks. Other Views, added with timeline.registerView, such as /withdraw, are outside the sequence and can be opened in any order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#050505"/>
    </marker>
  </defs>
  <rect width="760" height="610" fill="white"/>

  <!-- (a) Sequential Views -->
  <rect x="20" y="20" width="720" height="430" rx="9" fill="white" stroke="#050505" stroke-width="1.5"/>
  <text x="48" y="60" font-size="18" font-weight="600" fill="#050505">Sequential Views</text>
  <text x="48" y="84" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#444444">timeline.pushSeqView()</text>
  <text font-size="16" fill="#050505">
    <tspan x="48" y="124">Participants move through</tspan>
    <tspan x="48" y="144">these in order, one step</tspan>
    <tspan x="48" y="164">each time a View calls</tspan>
  </text>
  <text x="48" y="186" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#050505">api.goNextView()</text>

  <g stroke="#050505" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="420" y1="84" x2="420" y2="97"/>
    <line x1="420" y1="134" x2="420" y2="147"/>
    <line x1="420" y1="184" x2="420" y2="197"/>
    <line x1="420" y1="234" x2="420" y2="247"/>
    <line x1="420" y1="284" x2="420" y2="297"/>
    <line x1="420" y1="334" x2="420" y2="347"/>
    <line x1="420" y1="384" x2="420" y2="397"/>
  </g>
  <g stroke="#050505" stroke-width="1.5" fill="#B2D5E8">
    <circle cx="420" cy="66" r="16"/>
    <circle cx="420" cy="116" r="16"/>
    <circle cx="420" cy="166" r="16"/>
    <circle cx="420" cy="216" r="16"/>
    <circle cx="420" cy="266" r="16"/>
    <circle cx="420" cy="316" r="16"/>
    <circle cx="420" cy="366" r="16"/>
    <circle cx="420" cy="416" r="16"/>
  </g>
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#050505">
    <text x="420" y="71">1</text>
    <text x="420" y="121">2</text>
    <text x="420" y="171">3</text>
    <text x="420" y="221">4</text>
    <text x="420" y="271">5</text>
    <text x="420" y="321">6</text>
    <text x="420" y="371">7</text>
    <text x="420" y="421">8</text>
  </g>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#050505">
    <text x="452" y="71">/welcome</text>
    <text x="452" y="121">/consent</text>
    <text x="452" y="171">/demograph</text>
    <text x="452" y="221">/windowsizer</text>
    <text x="452" y="271">/task</text>
    <text x="452" y="321">/debrief</text>
    <text x="452" y="371">/feedback</text>
    <text x="452" y="421">/thanks</text>
  </g>

  <!-- (b) Other Views -->
  <rect x="20" y="470" width="720" height="120" rx="9" fill="#F2F2F2" stroke="#050505" stroke-width="1.5"/>
  <text x="48" y="508" font-size="18" font-weight="600" fill="#050505">Other Views</text>
  <text x="48" y="532" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#444444">timeline.registerView()</text>
  <text font-size="16" fill="#050505">
    <tspan x="48" y="562">Not in the sequence; opened directly.</tspan>
  </text>
  <circle cx="420" cy="520" r="16" fill="white" stroke="#050505" stroke-width="1.5"/>
  <text x="452" y="525" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#050505">/withdraw</text>
  <text x="452" y="548" font-size="14" fill="#6B6B6B">from the withdraw button, at any point</text>
</svg>
