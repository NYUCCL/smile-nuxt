  <rect x="280" y="20" width="200" height="150" rx="9" fill="white" stroke="#050505" stroke-width="1.5"/>
  <rect x="294" y="34" width="172" height="20" rx="5" fill="#E6E6E6" stroke="#050505" stroke-width="1.5"/>
  <rect x="294" y="64" width="110.08" height="72" rx="6" fill="#F2F2F2" stroke="#050505" stroke-width="1.5"/>
  <rect x="414.08" y="64" width="51.92" height="72" rx="6" fill="#F2F2F2" stroke="#050505" stroke-width="1.5"/>
  <text x="380.0" y="158" text-anchor="middle" font-size="15" font-family="SF Mono, Menlo, Consolas, monospace" fill="#050505">/instructions</text>
  <circle cx="380" cy="200" r="14" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="380" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#050505">2</text>
  <rect x="540" y="20" width="200" height="150" rx="9" fill="white" stroke="#050505" stroke-width="1.5"/>
