  <rect x="34" y="64" width="110.08" height="72" rx="6" fill="#F2F2F2" stroke="#050505" stroke-width="1.5"/>
  <rect x="154.07999999999998" y="64" width="51.92" height="72" rx="6" fill="#F2F2F2" stroke="#050505" stroke-width="1.5"/>
  <text x="120.0" y="158" text-anchor="middle" font-size="15" font-family="SF Mono, Menlo, Consolas, monospace" fill="#050505">/consent</text>
  <circle cx="120" cy="200" r="14" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
