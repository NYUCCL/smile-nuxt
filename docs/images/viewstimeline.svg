  <rect x="554" y="64" width="110.08" height="72" rx="6" fill="#F2F2F2" stroke="#050505" stroke-width="1.5"/>
  <rect x="674.08" y="64" width="51.92" height="72" rx="6" fill="#F2F2F2" stroke="#050505" stroke-width="1.5"/>
  <text x="640.0" y="158" text-anchor="middle" font-size="15" font-family="SF Mono, Menlo, Consolas, monospace" fill="#050505">/thanks</text>
  <circle cx="640" cy="200" r="14" fill="#B2D5E8" stroke="#050505" stroke-width="1.5"/>
  <text x="640" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#050505">3</text>
  <path d="M224,95 L276,95" fill="none" stroke="#050505" stroke-width="1.6" marker-end="url(#arrow)"/>
